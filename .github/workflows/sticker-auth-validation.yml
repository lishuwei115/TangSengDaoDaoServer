name: Sticker Auth Unit Validation

on:
  push:
    branches:
      - feature/sticker-auth

jobs:
  root-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
      - name: Run root package tests
        run: go test .
